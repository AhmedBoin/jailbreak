  <rect x="78" y="424" width="1444" height="2" fill="url(#accent)" opacity="0.55"/>
  <text x="1522" y="456" text-anchor="end" font-family="Consolas, Lucida Console, monospace" font-size="13" letter-spacing="3" fill="#3d5a73">OPEN PLAYBOOKS</text>
  <text x="78" y="456" font-family="Consolas, Lucida Console, monospace" font-size="13" letter-spacing="3" fill="#3d5a73">JAILBREAK.REPO</text>
</svg>
